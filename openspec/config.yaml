schema: spec-driven

# Project context — read by OpenSpec whenever it generates a proposal,
# design, spec, or tasks file for this repo.
context: |
  Obsidian plugin that lets non-technical (L1/L2) staff contribute to a
  GitLab-backed SOP knowledge base without touching git directly.

  PRODUCT THESIS
  The plugin's reason to exist is that authors never learn git. Any design
  that leaks git mechanics into the author's experience has failed its
  purpose, even if it works technically. See the vocabulary rule below.

  CAPABILITIES
  - plugin-shell — plugin lifecycle, sidebar view registration, ribbon
    icon, command palette entry.
  - platform-config — settings tab, SSH key, identity, setup checklist.
  - doc-authoring — new note creation, template, front matter, vault paths.
  - submission-tracking — document state derived from git.
  - git-publishing — ALL git and ssh process execution and every remote
    address. Confined here so a second platform can be added additively
    rather than surgically. Nothing outside this capability may spawn a
    process or know a platform's address or push-option shapes.
  - vault-sync — connecting a vault, getting updates, conflict choices.

  REFERENCE DOCS (`docs/`)
  Long-form reference that would bloat this file lives in `docs/`. These
  are not specs and not proposals — they are verified background an agent
  needs before designing against the platform. Read the relevant one
  BEFORE writing a design or spec that touches its subject, rather than
  re-deriving the facts or guessing.
  - `docs/gitlab-roles.md` — SUPERSEDED 2026-10-22 (no roles without the API; kept for history). Was: GitLab access levels (0/10/15/20/30/40/50),
    what each can do for this plugin's operations on the target CE
    instance, and the three independent permission gates (project role,
    credential permissions, protected-branch merge rights). Required
    reading for anything that shapes UI by role, and for milestone 8's
    gating. Records the load-bearing distinction that a role is an
    optimistic predictor, never proof a call will succeed.
  - `docs/document-identity.md` — how a document is identified, how its branch
    is named, how a note is reconnected to its merge request, where its file
    lives on the remote, and (§5) what happens when a branch name is already
    taken. Required reading before designing anything that names a branch,
    resolves a note to a merge request, decides a remote path, or resubmits a
    document that was rejected or already published.
  - `docs/access-tokens.md` — SUPERSEDED 2026-10-22 (the SSH key replaces the token; see design D11 of
    replace-rest-with-local-git-ssh). Was: which token type this project uses and why, what
    is held in memory versus written to disk, the open `secretStorage` spike,
    and what "Test connection" does and does not prove. Required reading
    before touching credential handling or authentication.
  - `docs/ce-verification.md` — UPDATED 2026-10-22 (gains a section for the SSH and push-option checks). every remote behaviour established on
    gitlab.com but NOT yet confirmed on the self-managed CE target,
    as a runnable checklist: permission names, response shapes the client
    parses, the `blocking_discussions_resolved` question, and the
    end-to-end checks. Each item says what breaks if the assumption is
    wrong. Read it before treating any platform behaviour as established,
    and record results there rather than in a change's tasks.
  - `docs/resubmission-lifecycle.md` — SUPERSEDED 2026-10-22 (state is derived from git). Was: the `create`-action bug blocking
    milestone 7 and the state-fork 6/7/7a share.
  - `docs/panel-tracking-scope.md` — SUPERSEDED 2026-10-22 (Get updates replaces Import and Recover). Was: milestones 5b and 9: Reset, panel
    scope, and Discover & Import.
  - `docs/ssh-setup.md` — how the plugin chooses and uses an SSH key, the
    security trade-offs recorded as decisions, and the results of the
    checks only a real machine can answer (the Windows go/no-go, the push
    options, unsaved notes). Replaces `docs/access-tokens.md`. Read it
    BEFORE changing how the plugin starts git or ssh, or how it picks a key.
  - `docs/rest-era-history.md` — the v1 milestone roadmap and the
    architecture decisions the REST-era plugin ran on, moved here verbatim
    on 2026-10-22. History, not guidance.
  When a decision in this file turns on a fact recorded in `docs/`, cite
  the doc rather than restating the fact — one copy, so the two cannot
  drift apart. Add a new doc when a subject needs more than a paragraph
  here, and list it above; an unlisted doc will not be found.

  MILESTONES
  The v1 roadmap (milestones 1–9a) is HISTORY as of 2026-10-22. It was the
  REST-era plugin's plan and moved, verbatim, to `docs/rest-era-history.md`.
  What survives into the current design, by milestone: 1 plugin shell
  (unchanged); 3 and 3a creating a document (unchanged, except `owner` now
  comes from the SSH key test); 4 submit for review (the same slice, now a
  plumbing commit and a push); 4a attachments (embedded images ride in the
  same commit; the plugin never deletes one); 5, 5a, 5b, 6, 7, 7a, 9 and 9a
  REPLACED by derived state, Get updates and Reset; 8 reviewer Merge RETIRED —
  reviewers merge in GitLab. New work follows OpenSpec changes, not this list.
  The current plan is the change `replace-rest-with-local-git-ssh`.

  Not yet milestoned, and not accidentally: multi-platform support (out of
  scope per git-publishing's capability boundary, not merely deferred),
  offline queueing (explicit non-goal), note-in-note transclusion —
  `![[Other Document]]` is a reference to another note rather than an
  attachment, so milestone 4a does not carry it and a host document
  published alone renders it broken (ADDED 2026-08-26, recorded here so
  it reads as a decision rather than an omission) — and anything beyond
  one-note-one-branch-one-merge-request. This list is for work that is
  genuinely OUT OF SCOPE. Work that is merely blocked or deferred belongs
  in the numbered sequence above, as a placeholder if it cannot be
  ordered yet — do not park it here, because that reads as dropped.
  Anything that appears in neither place is an oversight, not a decision:
  if a milestone hands work off to "some later milestone", check that a
  milestone actually claims it before considering that milestone done.

  ARCHITECTURE DECISIONS
  - Source of truth: GitLab, protected `main` branch.
  - GIT OVER SSH, NO TOKEN, NO REST. DECIDED 2026-10-22
    (replace-rest-with-local-git-ssh), REVERSING the earlier decision that the
    plugin used only the REST API with "no local git binary, no `git init`, no
    SSH keys, no `.git` folder in the vault ever". The plugin runs the system
    `git` over the author's own SSH key; `.git` lives inside the vault with
    ignore rules in `.git/info/exclude`; the plugin is desktop-only. Publish
    builds a commit with git plumbing — the working tree is never touched — and
    pushes it to `doc/<doc_id>` asking GitLab to open a review request. Get
    updates is a fetch plus a per-file rule against the last synced version.
    The plugin never runs `checkout`, `switch`, `merge`, `pull`, `rebase`,
    `restore`, `stash` or `reset --hard`; the process runner's allowlist
    enforces it. All process spawning stays in git-publishing.
    Reasons re-checked: attribution is per person with a key as with a token;
    vault-sync tools replicating `.git` is an environment risk the plugin warns
    about; "nothing pulls remote content back" is now Get updates. Detail is in
    that change's design.md (D1–D16); the replaced text is in
    `docs/rest-era-history.md`.
  - SUBMISSION STATE IS DERIVED FROM GIT, never stored and never written into
    the note's front matter. States: Waiting for review, Published, Not
    accepted, plus an "edited" marker, keyed by `doc_id` and not by the note's
    path. Lost on purpose: "Changes requested" (needs the API), "Not submitted
    yet" (a note with a `doc_id` has always been submitted), the role
    pre-check, and reviewer Merge (milestone 8, retired — reviewers merge in
    GitLab). `data.json` holds only the project address, the key path, the
    username and the key and address the last test covered.
  - GET UPDATES REVERSES THE OLD PULL RULE. The earlier rule (under NO CI
    PIPELINE) said any pull other than one author-confirmed document must
    baseline on the last content submitted from this vault and refuse while a
    document is awaiting review. That rule exists to prevent SILENT loss. Get
    updates keeps the purpose and drops the mechanism: a file is overwritten
    only if the note equals the last synced version; a note the author changed
    is merged or asked about; a recoverable copy is kept before any
    replacement; and it never refuses because a review is open.
  - THE STALE GUARD REPLACES `last_commit_id`. Before a publish, every file it
    carries must be unchanged on GitLab since the last update (or be the
    author's own merged change), and a live review must hold no commit this
    vault did not build; otherwise nothing is written and the author is told to
    get updates or to Reset. Losing someone's work silently is worse than
    failing the submit.
  - FAILURES ARE ATTEMPTED AND TRANSLATED. The plugin cannot pre-check what a
    key may do; it attempts the operation and maps the failure to plain words,
    never raw output. Setup-type failures return the panel to the matching
    checklist step.
  - SSH KEY, NOT A TOKEN. The author's own key — an existing one, or a
    dedicated key the plugin creates and never overwrites a file for — with git
    told to use only it, never to prompt, and to accept a host key on first
    connect. The plugin never reads a private key. The trade-offs are in that
    change's design.md (D11); `docs/access-tokens.md` is superseded.
  - Branch recreation — what happens when the plugin needs to create
    `doc/<doc_id>` and something is already in the way — lives in
    `docs/document-identity.md` §5: closed-without-merge is TERMINAL, and both
    resubmission cases cut the branch fresh from the default branch. Since
    replace-rest-with-local-git-ssh an abandoned branch is replaced by one
    lease-guarded push rather than deleted first. Read §5 BEFORE designing any
    resubmission path.
  - Document identity, branch naming and file paths live in
    `docs/document-identity.md`: `doc_id` is the filename snapshotted at FIRST
    SUBMIT and frozen; the branch derives from it and never from the live
    filename; the vault mirrors the repository 1:1 from the root; a document
    whose path has drifted is REFUSED rather than followed, duplicate-`doc_id`
    check first. Its reconciliation-by-merge-request material is superseded by
    derived state. Filenames must be unique across the repository:
    `docs/document-naming.md`.
  - NO CI PIPELINE. DECIDED 2026-08-26: `last_reviewed` is human-maintained,
    edited by the author on the revision that reviews the document, and
    autofilled once, at creation, equal to `created`. Under CI it would mean
    "last merged", which git already records; human-maintained it means
    "someone re-read this and confirmed it is still true", which git does not
    know. The mechanical ground (nothing pulls remote content back, so a
    guarded pull deadlocks) is superseded by Get updates; the full text is in
    `docs/rest-era-history.md`. "CI deletes the source branch" stays struck:
    GitLab auto-deletes on merge already.
  - Plugin data (`data.json`) is plaintext. It holds only the project address,
    the key path, the username and the key and address the last test covered.
    Nothing secret, and the plugin never reads a private key. Flag explicitly
    before persisting anything else.
  - Pre-submit drafts have no versioning of their own beyond Obsidian's
    built-in File Recovery core plugin — do not build custom local
    versioning. Real version history starts at the first "submit."
  - Model: one note = one branch = one merge request (v1). Multi-doc MRs
    are an explicit non-goal for now.
  - Revisions reuse the same branch and the same merge request. A review
    round never creates a second merge request.
  - One writer per branch. Reviewers comment; the author edits. Reviewers
    editing an in-flight submission from inside the plugin is OUT OF SCOPE
    for v1 — not merely deferred. Git permits it (the branch is in the
    same project and unprotected, so any Developer may push, and the merge
    request updates itself), but it breaks three things here:
      1. The reviewer's vault does not hold the author's in-flight
         version — only whatever is in `main`, or nothing. Editing would
         require pulling branch content into their vault, producing a
         second local note carrying the same `doc_id`, which the
         collision rule above already requires the plugin to refuse.
      2. Lost updates. The commit API sends whole file content, not a
         diff, so a reviewer's fix is silently reverted the next time the
         author submits from their now-stale local copy. No conflict is
         raised. The author's copy is guaranteed stale after any reviewer
         edit, so this is the normal case, not an edge case.
      3. On Premium/Ultimate, "prevent approvals by users who add
         commits" disqualifies a reviewer who edits from then approving.
         With few reviewers this can leave a document unapprovable while
         someone is away.
    The supported path for "it is one typo, let me just fix it" is an
    "Open in GitLab" link to the Web IDE, which handles the branch, the
    concurrency, and the vault problem already. Reviewers are more
    technical than authors by definition, so this is an acceptable
    handoff for them in a way it would not be for authors.
    AMENDED 2026-10-22 (replace-rest-with-local-git-ssh): point 2 (lost
    updates) is now refused by the stale guard rather than guarded by
    `last_commit_id`; reviewers still do not edit through the plugin.
  - CODEOWNERS is a Premium feature and therefore unavailable here.
    Anything that would have relied on automatic reviewer assignment by
    folder needs another mechanism.
  - No offline submit queue for v1: authoring is always local/offline-safe
    already (plain file save), and "Submit for review" is a deliberate,
    in-the-moment click — it must fail loudly on network/API failure
    rather than swallow the error, and retries must be idempotent (check
    whether the branch/MR already exists before redoing a partially
    completed submit).
  - UI placement: panel opens in the RIGHT sidebar (Obsidian convention for
    contextual tools; the left sidebar is for vault navigation). Two entry
    points, both calling the same activation path: a ribbon icon and a
    command palette command.
  - Front matter contract for authored notes: `doc_id`, `title`,
    `category`, `lifecycle`, `created`, `last_reviewed`, and `owner` —
    all seven confirmed, none conditional. Required fields must be
    present and non-empty
    before a note can be submitted; validation happens in the plugin with
    an inline prompt, not as a CI failure after the fact.
    WHO WRITES WHAT, AND WHEN — AMENDED 2026-08-26. The clause "`doc_id`
    is plugin-generated and immutable — the author never edits it" is
    superseded by the `doc_id` decision above: it is the author's own
    filename, snapshotted by the plugin. The full split:
      - at creation (milestone 3), plugin-written, never re-asserted:
        `owner`, `created`, `last_reviewed`, `lifecycle`.
      - at first submit (milestone 4): `title` and `category` from the
        author, `doc_id` snapshotted from the filename.
      - by hand, by the author, at any time thereafter, with the plugin
        never writing again: `title`, `category`, `lifecycle`,
        `last_reviewed`, `owner`.
    CLARIFIED 2026-09-14 (milestone 9): "first submit" means THIS VAULT'S
    first submit of the document, not "the note has no `doc_id`". An
    imported document carries `doc_id` frozen at import and has never
    been through the moment `title`/`category` are written, so its next
    submit collects and writes them — performing the contract, not
    repeating it. `category`'s presence is what tells the two apart: the
    plugin alone writes it (§E2 found it absent from all 34 real
    documents), so a note carrying `doc_id` but no `category` has never
    submitted from here. Without this, freezing `doc_id` at import only
    MOVES §E3's refusal from the collision check to the front-matter one
    and an imported document is still unsubmittable — observed in the
    running plugin, §E6.
    `title` IS NOT THE FILENAME, and the two are deliberately allowed to
    differ. The filename is the control ID —
    `SBT-KE-001_EG95-mTLS-Socket-Reopen-Error200.md`; `title` is what a
    human reads — "CEPAS 3 Payments Fail with Error 200". Splitting them
    is what lets the filename be a frozen identifier while the title
    stays freely editable, and it is why there is no drift between them
    to prevent.
  - `category` IS ONE OF NINE FIXED DELIVERABLES, and has NO MECHANICAL
    ROLE. DECIDED 2026-08-26. The values: User Manual, Operational
    Manual, Release FAQ, SOP, Runbook, Configuration Reference,
    Diagnostic Reference, Known Errors, Safe-Action Boundaries. The list
    is closed — a tenth deliverable means shipping a plugin update.
    It does not route, does not name anything, and does not gate. An
    earlier design had it deriving the remote path (`docs/<category>/…`);
    the vault-mirroring decision above superseded that and nothing
    replaced it. Written down so that nobody later sees nine tidy enum
    values and rebuilds routing on them.
    Where `category` and the folder disagree — a note in `Known-errors/`
    declaring `category: SOP` — the plugin does NOT block. The folder
    decides the file's location because it IS the location; the field is
    editorial classification, and a reviewer catches the mismatch during
    review. Deliberately human-in-the-loop rather than plugin logic
    reconciling two things that were never mechanically linked.
  - `owner` is KEPT. DECIDED 2026-08-26, resolving what was an open
    question scoped to doc-authoring. It is autofilled from the
    authenticated identity when the note is created, and the plugin never
    writes it again.
    The case that carried it is the reading-side one, made explicitly
    rather than inherited: someone browsing a published document should
    see who owns it without opening GitLab. This is reader experience
    chosen over data purity, knowingly. The counter-argument stands and
    was not refuted — GitLab already records who authored every commit
    and every merge request, server-side and unspoofable, so `owner` is a
    second and weaker copy of a record that already exists.
    ACCEPTED RISK: drift. The field is plain text in a file the author can
    edit, so it can be made to contradict the real GitLab history, and
    nothing in the plugin prevents that. Accepted deliberately. Do not
    "fix" this later by having the plugin overwrite the field on every
    submit — see the open question below for why that would destroy a
    legitimate use before it destroyed a wrong value.
    Autofill is why milestone 3 now depends on milestone 2: the
    authenticated identity comes from the retained connection state, so a
    note cannot be created before a successful connection check in that
    session.
    THE VALUE IS `identity.username`, and nothing else. DECIDED
    2026-08-26. `GET /user` returns it as a first-class field and
    milestone 2 already retains it. REJECTED: deriving it from the
    account's email by stripping the domain. A GitLab username is not
    the email local-part — `ivan.nguyen@…` may perfectly well be
    username `inguyen` — so the derived string looks right and resolves
    to no account. It would also make the field depend on reading the
    email, a permission that may not be granted and that, per gate 2,
    cannot be checked in advance.
    AMENDED 2026-10-22 (replace-rest-with-local-git-ssh): with no token there
    is no `GET /user`. The username comes from the SSH key test (the
    server's greeting) or is typed once. The rule stands: it is the
    username, never derived from an email, and a note cannot be created
    before setup is complete.
  - `owner` MEANS "WHO IS RESPONSIBLE FOR IT", not "who created it".
    DECIDED 2026-08-26, closing what was recorded as an open question the
    day it was raised.
    This is the reading under which the field carries information GitLab
    does NOT have, which is the strongest form of the reading-side case
    that justified keeping it at all. Under the rejected reading — a
    snapshot of authorship — the field would duplicate a record GitLab
    already holds unspoofably, and the justification for keeping it would
    have been correspondingly weaker.
    Consequence, and this is the load-bearing part: ownership can
    LEGITIMATELY TRANSFER. A hand-edit of `owner` is therefore a FEATURE
    of this design, not an instance of the drift accepted above. The two
    look identical in a diff and are opposite in intent, which is exactly
    why this had to be written down.
    THE PLUGIN MUST NEVER RE-ASSERT `owner` ON SUBMIT. It is autofilled
    once, at creation, and never written again. Overwriting it on submit
    is the obvious-looking cure for drift and would silently revert
    deliberate transfers — destroying a supported use to prevent an
    accepted risk. Do not add this later as a data-integrity improvement.
    A reviser who is not the owner is expected to leave the field alone.
    Revising someone else's document does not transfer it; only an
    explicit handover does.
  - Handover and revision policy. DECIDED 2026-08-26, following from the
    `owner` semantics above. Four rules, and note that the size of a
    change decides nothing in any of them:
      - OWNERSHIP TRANSFER is an in-place revision. The incoming owner
        edits the `owner` field and submits through milestone 7 like any
        other revision. No new document, no new `doc_id`.
      - `doc_id` IS IMMUTABLE, permanently. Neither a rewrite, however
        extensive, nor a change of owner mints a new one. `doc_id` answers
        "which document is this", and neither the volume of edits nor the
        identity of the responsible person changes that answer.
      - SUPERSEDING is reserved strictly for a document conceptually
        replaced by a DIFFERENT document — "VPN Setup" giving way to
        "Zero Trust Access". Old document goes to
        `lifecycle: superseded`, new document gets a new `doc_id`. It is
        NOT for large diffs and NOT for handovers.
      - CHANGELOGS IN THE DOCUMENT ARE EXPRESSLY OMITTED. History is
        delegated to git, which records what changed and who changed it
        unspoofably — including edits to `owner`, so ownership history
        comes free. Freshness is delegated to `last_reviewed`. A
        hand-maintained changelog would be the same trade already
        accepted for `owner`, but a worse one: it needs updating on every
        change rather than only at handover, so it drifts faster, and it
        duplicates something git answers precisely.
    Rejected: keying any of this on the magnitude of a change — archiving
    the old document and having the incoming owner write a fresh version
    when the changes are "significant". "Significant" cannot be defined,
    so two people apply it differently and the rule decays into author
    preference. It also conflates two independent axes — who is
    responsible, and which document this is. Readers want one stable place
    to find the current procedure, not a chain of superseded documents to
    walk backwards through.
  - `lifecycle` is EDITORIAL, not workflow: `active`, `deprecated`,
    `superseded`. It describes the standing of a published document and a
    published document keeps moving through it long after any merge
    request is closed. The author owns this field and edits it by hand;
    the plugin never writes it. It is deliberately not called `status`,
    because that word was ambiguous against the submission states above —
    two different lifecycles on two different axes, and doc-authoring and
    submission-tracking must not both be built against a field of the
    same name meaning different things.
    AMENDED 2026-08-26: the plugin DOES write it once, at creation, as
    `lifecycle: active`. "The author owns this field and edits it by
    hand; the plugin never writes it" was aimed at the plugin
    RE-ASSERTING the value later — the same distinction the `owner`
    decision draws — not at leaving a required enum blank so that every
    author's first act is typing one of three legal values into it.
    Written once at creation, never written again.
    REJECTED: `lifecycle: draft` at creation, flipping to `active` on
    merge. It reintroduces the exact word banned two sentences up, it
    merges the editorial axis back into the submission axis, and it lands
    workflow state in front matter, which the rule above forbids
    outright. All three of that rule's stated failure modes fire, and the
    stale-value one fires every review round after the first, since a
    revision of a published document submits carrying `active` while its
    merge request is still open. It also carries no information: "not
    merged yet" is already `unsubmitted`, tracked in plugin data.
    "Draft" does not survive as a display label either. This sentence
    used to say it did, for the `unsubmitted` state, which contradicted
    the states decision above giving that state the label "Not submitted
    yet". RESOLVED 2026-09-11 in favour of "Not submitted yet", raised by
    add-document-status: this decision rejects `draft` as a STATE name
    precisely because GitLab's Draft merge requests mean something else,
    and using it as the label the author READS reintroduces exactly that
    ambiguity. The word is now unused on both axes.
  - Project and plugin identity: the repository, the npm package, and the
    manifest `id` are all `obsidian-docs-publisher`. The display name is
    "Docs Publisher". Chosen to be platform-agnostic — not `gitlab-*`,
    because GitHub and Gitea are plausible later, and not `sop-*`, because
    the SOP framing is this team's use case rather than the plugin's
    scope. It also avoids confusion with the existing community plugin
    "Obsidian Github Publisher", which a `git-publisher` name would have
    sat awkwardly close to. Obsidian's registry strips the `obsidian-`
    prefix on display, so the repository keeps the full name while the
    store shows "Docs Publisher".
    The manifest `id` is NOT a free-to-change label. Obsidian keys plugin
    enablement off it and loads plugin data from the plugin's own folder,
    conventionally named for the id, so changing it after distribution
    makes Obsidian treat it as a different plugin: it needs re-enabling,
    and data saved under the old identity is not picked up. From
    platform-config onward that data holds the author's settings — no
    secret. Treat the id as fixed from the first commit.
  - `.gitignore` MUST include `data.json` from the very first commit, and
    the entry must carry a comment saying why. Obsidian plugins are
    normally developed inside a vault's `.obsidian/plugins/<id>/` folder,
    which makes the repository root and the plugin's runtime folder the
    same directory, so `data.json` is generated in the working tree. From
    platform-config it holds the author's settings — no secret. The entry
    is kept regardless: local plugin data has no business in git either way. It does not exist during plugin-shell, which is
    precisely why it gets forgotten — `.gitignore` is written once and
    rarely revisited.
  - Tech: TypeScript, Obsidian Plugin API, esbuild bundler, no UI framework.

# Per-artifact rules — enforced habits agreed during exploration.
rules:
  proposal:
    - >-
        Scope to a single, minimal increment — no bundling multiple
        behaviors into one change. Registering an empty sidebar view and
        wiring up submission are separate proposals.
    - >-
        Explicitly list what is deferred to a later proposal.
    - >-
        Each increment must be a vertical slice that produces something a
        person can click and observe. Do not propose a change that builds an
        API client, data layer, or abstraction with no user-visible surface
        calling it.
  design:
    - >-
        Remote API interaction belongs to the git-publishing capability and
        nowhere else. If a design places an HTTP call or a platform-specific
        payload shape outside that capability, say so and relocate it.
    - >-
        Prefer the boring option. This is a four-person internal tool; call
        out when a design is speculative generality.
  specs:
    - >-
        AMENDED 2026-08-26. The git-vocabulary ban is scoped BY AUDIENCE,
        not applied to every string in the plugin. It previously read "user-
        facing strings must never contain the words branch, commit, merge
        request, MR, conflict, or main", which was unworkable once the
        reviewer surface needed a name for the action that publishes a
        document. The ban was not weakened — it was aimed.
    - >-
        AUTHOR-FACING surfaces: the ban stands, in full. The words branch,
        commit, merge request, MR, conflict, and main must never appear.
        This covers creating a document, submitting it, sending updates,
        every display of a document's own state, every failure message on
        those paths, and the settings tab — which every author uses. Write
        these in author vocabulary instead: Submit for review, Send updates, Get updates, Waiting for review, Published, Not accepted. This is the product thesis in enforceable form: authors
        never learn git, and a design that leaks git mechanics into their
        experience has failed even if it works.
    - >-
        REVIEWER-FACING surfaces: git vocabulary is permitted. This covers
        the review queue and the actions taken on it, including the action
        that publishes a document, which may be called Merge. Reviewers
        hold Maintainer access or above and already work in GitLab
        directly — the config's own reasoning for handing them an "Open in
        GitLab" escape hatch, that "reviewers are more technical than
        authors by definition", applies here for the same reason.
    - >-
        Where one string is seen by BOTH audiences, the author-facing rule
        wins. Ambiguity resolves toward the ban, never away from it.
        Internal identifiers, code, and API documentation remain exempt
        regardless of audience.
    - >-
        Role names from GitLab (Guest, Planner, Reporter, Developer,
        Maintainer, Owner) are NOT git vocabulary for this rule's purposes
        and are shown literally on every surface, author-facing included —
        see docs/gitlab-roles.md §7 for why translating them was rejected.
        Copy beside a role must say what to DO, since the role name alone
        will not tell an author what it means.
    - >-
        Every failure mode a scenario introduces must specify the exact
        message the author sees, in that same vocabulary. Shows an error is
        not an acceptance criterion.
  tasks:
    - >-
        Prefer the smallest set of tasks that produces something demoable.
    - >-
        State the observable check that closes the change — what to click
        and what should happen — not just the code that must exist.
